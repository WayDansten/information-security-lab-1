plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

/*
 * Targeted overrides for vulnerable third-party libraries found in the
 * supplied Dependency-Check report. Spring Boot 3.5.16 remains unchanged.
 *
 * IMPORTANT:
 * Spring Framework 6.2.20, Spring Security 6.5.12 and Spring Data JPA
 * 3.5.14 are listed by Spring as Enterprise-only fixes. Do not force these
 * versions on a public-only build: the artifacts may not be resolvable
 * without the Spring Enterprise repository and entitlement.
 *
 * The Spring CVEs therefore cannot all be fixed while staying on the
 * public Spring Boot 3.5.16 dependency set. See the notes accompanying this
 * file and consider a Spring Enterprise subscription or a major Boot upgrade.
 */
ext {
    // Spring Boot 3.5 uses these properties to manage the corresponding BOMs.
    // Tomcat 10.1.59 contains fixes for the Tomcat CVEs in the supplied report.
    set('tomcat.version', '10.1.59')

    // CVE-2026-54515 is fixed in Jackson Databind 2.21.5.
    set('jackson-bom.version', '2.21.5')

    // Log4j 2.25.5 addresses CVE-2026-49844; it also includes the
    // Log4j 2.25.4 fix for CVE-2026-34477.
    set('log4j2.version', '2.25.5')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation 'org.jsoup:jsoup:1.18.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotbugs {
    ignoreFailures = false
    showProgress = true
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = true
        sarif.required = true
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON', 'SARIF']
    autoUpdate = System.getenv('DEPENDENCY_CHECK_AUTO_UPDATE') != 'false'
    scanDependencies = true
    scanConfigurations = ['runtimeClasspath']
    skipTestGroups = false
    suppressionFile = 'config/dependency-check-suppressions.xml'

    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }

    analyzers {
        ossIndex {
            enabled = false
        }
    }
}
