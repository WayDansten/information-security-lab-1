plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation 'org.jsoup:jsoup:1.18.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    constraints {
        implementation('com.fasterxml.jackson.core:jackson-databind') {
            version { strictly('2.21.5') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.apache.logging.log4j:log4j-api') {
            version { strictly('2.25.5') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.apache.logging.log4j:log4j-to-slf4j') {
            version { strictly('2.25.5') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-aop') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-aspects') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-beans') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-context') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-core') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-expression') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-jcl') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-jdbc') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-orm') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-tx') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-web') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework:spring-webmvc') {
            version { strictly('6.2.20') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework.data:spring-data-jpa') {
            version { strictly('3.5.14') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework.security:spring-security-config') {
            version { strictly('6.5.12') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework.security:spring-security-core') {
            version { strictly('6.5.12') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework.security:spring-security-crypto') {
            version { strictly('6.5.12') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.springframework.security:spring-security-web') {
            version { strictly('6.5.12') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.apache.tomcat.embed:tomcat-embed-core') {
            version { strictly('10.1.60') }
            because 'Security update based on Dependency-Check report'
        }
        implementation('org.apache.tomcat.embed:tomcat-embed-websocket') {
            version { strictly('10.1.60') }
            because 'Security update based on Dependency-Check report'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotbugs {
    ignoreFailures = false
    showProgress = true
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = true
        sarif.required = true
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON', 'SARIF']
    autoUpdate = System.getenv('DEPENDENCY_CHECK_AUTO_UPDATE') != 'false'
    scanDependencies = true
    scanConfigurations = ['runtimeClasspath']
    skipTestGroups = false
    suppressionFile = 'config/dependency-check-suppressions.xml'

    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }

    analyzers {
        ossIndex {
            enabled = false
        }
    }
}