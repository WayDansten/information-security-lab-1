name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Build and run tests
        run: ./gradlew clean check --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/test-results/test/
          if-no-files-found: warn

  sast:
    name: SAST (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Run SpotBugs SAST
        run: ./gradlew compileJava spotbugsMain --no-daemon
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: |
            build/reports/spotbugs/
            build/reports/spotbugs/main.sarif
          if-no-files-found: warn
      - name: Publish SpotBugs results to GitHub Code Scanning
        if: always() && hashFiles('build/reports/spotbugs/**/*.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Restore NVD database cache
        id: nvd-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: Run OWASP Dependency-Check SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_AUTO_UPDATE: ${{ steps.nvd-cache.outputs.cache-hit != 'true' }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon
      - name: Save NVD database cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            build/reports/dependency-check-report.html
            build/reports/dependency-check-report.json
            build/reports/dependency-check-report.sarif
          if-no-files-found: warn
      - name: Publish Dependency-Check results to GitHub Code Scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: dependency-check